<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikhail's Memoir - Contact</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f4;
            color: #333333;
        }

        .header {
            overflow: hidden;
            background-color: rgb(112, 41, 99);
            padding: 10px 15px;
        }

        .header a {
            float: left;
            color: white;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-size: 18px;
            line-height: 25px;
            border-radius: 4px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        .header a.logo {
            font-size: 25px;
            font-weight: bold;
        }

        .header a:hover {
            background-color: rgb(48, 25, 52);
            color: white;
        }

        .header a.active {
            background-color: rgb(48, 25, 52);
            color: white;
        }

        .header-Right {
            float: right;
        }

        .container {
            max-width: 800px;
            margin: 40px auto 80px auto;
            padding: 30px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.05);
        }

        h1 {
            color: rgb(112, 41, 99);
            text-align: center;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 50px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #content {
            color: maroon;
            text-align: center;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 24px;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: rgb(112, 41, 99);
            display: block;
            margin-top: 10px;
        }

        input[type=text], input[type=email], textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        input[type=submit] {
            background-color: rgb(112, 41, 99);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        input[type=submit]:hover {
            background-color: rgb(48, 25, 52);
        }

        .footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: rgb(170, 51, 106);
            color: rgb(240, 246, 242);
            text-align: center;
            padding: 12px 0;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header">
            <div class="header-Left">
                <a href="index.html" class="logo">Mikhail's Memoir</a>
            </div>
            <div class="header-Right">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="resume.html">Resume</a>
                <a href="services.html">Services</a>
                <a href="testimonials.html">Testimonials</a>
                <a class="active" href="contact.html">Contact</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>Contact Me</h1>
        <p id="content">Send Me a Message</p>


        <p style="text-align: center; margin-bottom: 20px;">
            Or email me directly: 
            <a href="mailto:mikhailfaisal.baruang@g.msuiit.edu.ph" style="color: rgb(112, 41, 99); font-weight: bold; text-decoration: underline;">mikhailfaisal.baruang@g.msuiit.edu.ph</a>
        </p>

        <form action="#" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your Email Address" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

            <input type="submit" value="Send Message">
        </form>
    </div>

    <footer class="footer">
        © Copyright Khail's Property. All Rights Reserved 2026.
    </footer>

</body>
</html>
